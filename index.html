<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Spin the Wheel — Random Name Picker — Tabutility</title>
<meta name="description" content="Free spin the wheel name picker. Add names, spin, and get a random winner. Great for classrooms, giveaways and decisions."/>

<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>

<style>*{box-sizing:border-box;margin:0;padding:0}body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#0f172a;color:#f1f5f9;min-height:100vh}nav{background:#1e293b;border-bottom:1px solid #334155;padding:14px 24px;display:flex;align-items:center;gap:16px}nav a{color:#94a3b8;text-decoration:none;font-size:14px}nav a:hover{color:#f1f5f9}nav .brand{color:#38bdf8;font-weight:700;font-size:18px}.ad-banner{background:#1e293b;border-bottom:1px solid #334155;padding:8px;text-align:center}</style>

<body>
<nav><span class="brand">⚡ Tabutility</span><a href="https://tabutility.com">← All Tools</a></nav>
<div class="ad-banner"><ins class="adsbygoogle" style="display:block" data-ad-client="ca-pub-7039091592734005" data-ad-slot="auto" data-ad-format="auto" data-full-width-responsive="true"></ins><script>(adsbygoogle=window.adsbygoogle||[]).push({});</script></div>
<div id="root"></div>
<script type="text/babel">
//<![CDATA[
const { useState, useRef, useEffect } = React;

const PALETTE = ['#ef4444','#f97316','#eab308','#22c55e','#06b6d4','#3b82f6','#8b5cf6','#ec4899','#14b8a6','#f59e0b','#84cc16','#a855f7'];

function drawWheel(canvas, names, rotation) {
  const ctx = canvas.getContext('2d');
  const W = canvas.width; const H = canvas.height;
  const cx = W/2; const cy = H/2; const r = Math.min(cx,cy) - 10;
  ctx.clearRect(0,0,W,H);
  if (names.length === 0) {
    ctx.fillStyle = '#334155'; ctx.beginPath(); ctx.arc(cx,cy,r,0,2*Math.PI); ctx.fill();
    ctx.fillStyle = '#64748b'; ctx.font = '16px sans-serif'; ctx.textAlign = 'center';
    ctx.fillText('Add names to spin', cx, cy);
    return;
  }
  const slice = (2 * Math.PI) / names.length;
  names.forEach((name, i) => {
    const start = rotation + i * slice;
    const end = start + slice;
    ctx.beginPath(); ctx.moveTo(cx,cy);
    ctx.arc(cx,cy,r,start,end);
    ctx.closePath();
    ctx.fillStyle = PALETTE[i % PALETTE.length];
    ctx.fill();
    ctx.strokeStyle = '#0f172a'; ctx.lineWidth = 2; ctx.stroke();

    ctx.save();
    ctx.translate(cx,cy);
    ctx.rotate(start + slice/2);
    ctx.textAlign = 'right';
    ctx.fillStyle = '#fff';
    ctx.font = `bold ${Math.min(16, 140/names.length + 8)}px sans-serif`;
    const maxLen = 14;
    const label = name.length > maxLen ? name.slice(0,maxLen)+'…' : name;
    ctx.fillText(label, r - 12, 5);
    ctx.restore();
  });
  // Center dot
  ctx.beginPath(); ctx.arc(cx,cy,16,0,2*Math.PI); ctx.fillStyle='#1e293b'; ctx.fill();
  ctx.strokeStyle='#475569'; ctx.lineWidth=2; ctx.stroke();
}

export default function NamePicker() {
  const [names, setNames] = useState(['Alice','Bob','Charlie','Diana','Edward','Fiona']);
  const [input, setInput] = useState('');
  const [rotation, setRotation] = useState(0);
  const [spinning, setSpinning] = useState(false);
  const [winner, setWinner] = useState(null);
  const [history, setHistory] = useState([]);
  const canvasRef = useRef(null);
  const animRef = useRef(null);

  useEffect(() => {
    if (canvasRef.current) drawWheel(canvasRef.current, names, rotation);
  }, [names, rotation]);

  const spin = () => {
    if (spinning || names.length < 2) return;
    setWinner(null);
    const extraSpins = 5 + Math.random() * 5;
    const extraAngle = Math.random() * 2 * Math.PI;
    const totalAngle = extraSpins * 2 * Math.PI + extraAngle;
    const duration = 3000 + Math.random() * 1000;
    const startTime = performance.now();
    const startRot = rotation;
    setSpinning(true);

    const animate = (now) => {
      const elapsed = now - startTime;
      const progress = Math.min(elapsed / duration, 1);
      const ease = 1 - Math.pow(1 - progress, 4);
      const currentRot = startRot + totalAngle * ease;
      setRotation(currentRot);
      if (progress < 1) {
        animRef.current = requestAnimationFrame(animate);
      } else {
        const finalRot = currentRot;
        const slice = (2 * Math.PI) / names.length;
        const normalised = ((-(finalRot % (2*Math.PI))) + 2*Math.PI) % (2*Math.PI);
        const winnerIdx = Math.floor(normalised / slice) % names.length;
        const w = names[winnerIdx];
        setWinner(w);
        setHistory(h => [w, ...h.slice(0,9)]);
        setSpinning(false);
      }
    };
    animRef.current = requestAnimationFrame(animate);
  };

  const addName = () => {
    const n = input.trim();
    if (n && !names.includes(n)) { setNames(prev => [...prev, n]); setInput(''); setWinner(null); }
  };

  const removeName = (name) => { setNames(prev => prev.filter(x => x !== name)); setWinner(null); };

  return (
    <div style={{maxWidth:800,margin:'40px auto',padding:'0 20px'}}>
      <h1 style={{textAlign:'center',fontSize:28,fontWeight:700,marginBottom:8}}>Spin the Wheel</h1>
      <p style={{textAlign:'center',color:'#94a3b8',marginBottom:32}}>Random name picker — add names, spin, get a winner</p>

      <div style={{display:'grid',gridTemplateColumns:'1fr 320px',gap:24,alignItems:'start'}}>
        <div style={{textAlign:'center'}}>
          <div style={{position:'relative',display:'inline-block'}}>
            <canvas ref={canvasRef} width={320} height={320} style={{borderRadius:'50%',display:'block'}}/>
            {/* Pointer */}
            <div style={{position:'absolute',top:'50%',right:-12,transform:'translateY(-50%)',width:0,height:0,borderTop:'14px solid transparent',borderBottom:'14px solid transparent',borderRight:'28px solid #f1f5f9'}}/>
          </div>
          <button onClick={spin} disabled={spinning || names.length < 2}
            style={{marginTop:20,background:spinning||names.length<2?'#334155':'#38bdf8',color:spinning||names.length<2?'#64748b':'#0f172a',border:'none',borderRadius:14,padding:'14px 48px',fontSize:20,fontWeight:700,cursor:spinning||names.length<2?'not-allowed':'pointer',transition:'background 0.2s'}}>
            {spinning ? 'Spinning…' : 'SPIN'}
          </button>
          {winner && (
            <div style={{marginTop:16,background:'#1e293b',borderRadius:14,padding:'16px 24px',border:'2px solid #38bdf8'}}>
              <div style={{fontSize:13,color:'#64748b',marginBottom:4}}>🎉 WINNER</div>
              <div style={{fontSize:28,fontWeight:700,color:'#38bdf8'}}>{winner}</div>
            </div>
          )}
        </div>

        <div>
          <div style={{background:'#1e293b',borderRadius:16,padding:16,border:'1px solid #334155',marginBottom:16}}>
            <h2 style={{fontSize:15,fontWeight:600,marginBottom:12}}>Names ({names.length})</h2>
            <div style={{display:'flex',gap:8,marginBottom:12}}>
              <input value={input} onChange={e=>setInput(e.target.value)} onKeyDown={e=>e.key==='Enter'&&addName()} placeholder="Add a name…"
                style={{flex:1,background:'#0f172a',color:'#f1f5f9',border:'1px solid #334155',borderRadius:8,padding:'8px',fontSize:14}}/>
              <button onClick={addName} style={{background:'#38bdf8',color:'#0f172a',border:'none',borderRadius:8,padding:'8px 14px',fontWeight:700,cursor:'pointer'}}>+</button>
            </div>
            <div style={{maxHeight:280,overflowY:'auto'}}>
              {names.map((name,i) => (
                <div key={name} style={{display:'flex',justifyContent:'space-between',alignItems:'center',padding:'7px 10px',borderRadius:8,marginBottom:4,background:'#0f172a'}}>
                  <div style={{display:'flex',alignItems:'center',gap:8}}>
                    <div style={{width:10,height:10,borderRadius:'50%',background:PALETTE[i%PALETTE.length]}}/>
                    <span style={{fontSize:14}}>{name}</span>
                  </div>
                  <button onClick={()=>removeName(name)} style={{background:'none',border:'none',color:'#475569',cursor:'pointer',fontSize:16}}>✕</button>
                </div>
              ))}
            </div>
            <button onClick={()=>{setNames([]);setWinner(null);}} style={{width:'100%',marginTop:8,background:'none',border:'1px solid #334155',color:'#94a3b8',borderRadius:8,padding:'7px',fontSize:13,cursor:'pointer'}}>Clear all</button>
          </div>

          {history.length > 0 && (
            <div style={{background:'#1e293b',borderRadius:16,padding:16,border:'1px solid #334155'}}>
              <h2 style={{fontSize:15,fontWeight:600,marginBottom:10}}>History</h2>
              {history.map((h,i) => (
                <div key={i} style={{fontSize:14,color:i===0?'#38bdf8':'#64748b',padding:'3px 0'}}>{i===0?'🏆':` ${i}.`} {h}</div>
              ))}
            </div>
          )}
        </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<NamePicker />);
//]]>
</script>
</body>
</html>
